<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Helper — Write the Perfect Letter in Minutes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF7F2;
            --navy: #2C3E6B;
            --navy-dark: #1e2d52;
            --terra: #C4714F;
            --terra-dark: #b0633f;
            --sage: #5A8A62;
            --sage-dark: #4a7252;
            --text: #2A2520;
            --text-light: #6B6560;
            --card: #FFFFFF;
            --border: #E0D8CE;
            --shadow: rgba(44, 62, 107, 0.09);
            --green-bg: #EEF7F0;
            --green-border: #B8DEC0;
            --green-text: #2E6E38;
            --selected-bg: #ECF0F8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            font-size: 18px;
            line-height: 1.65;
        }

        /* ── HEADER ── */
        header {
            background: var(--navy);
            padding: 2.2rem 1.5rem 1.8rem;
            text-align: center;
        }

        .header-badge {
            display: inline-block;
            background: rgba(196,113,79,0.25);
            color: #F4B49A;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.02em;
        }

        header h1 span { color: var(--terra); }

        header p {
            color: rgba(255,255,255,0.72);
            margin-top: 0.5rem;
            font-size: 1.05rem;
        }

        /* ── PROGRESS BAR ── */
        .progress-bar {
            background: rgba(255,255,255,0.15);
            height: 5px;
        }
        .progress-fill {
            height: 100%;
            background: var(--terra);
            transition: width 0.5s cubic-bezier(.4,0,.2,1);
        }

        /* ── MAIN ── */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 2.2rem 1.5rem 5rem;
        }

        /* ── STEP DOTS ── */
        .steps-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }
        .step-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s;
        }
        .step-dot.active { background: var(--navy); transform: scale(1.3); }
        .step-dot.done { background: var(--sage); }

        /* ── STEP HEADER ── */
        .step-header { text-align: center; margin-bottom: 2rem; }
        .step-label {
            font-size: 0.82rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--terra); margin-bottom: 0.4rem;
        }
        .step-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem; font-weight: 700; color: var(--navy);
        }
        .step-subtitle { color: var(--text-light); margin-top: 0.4rem; font-size: 1rem; }

        /* ── LETTER TYPE GRID ── */
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
        }

        .letter-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.9rem;
        }
        .letter-card:hover {
            border-color: var(--navy);
            box-shadow: 0 4px 18px var(--shadow);
            transform: translateY(-2px);
        }
        .letter-card.selected {
            border-color: var(--navy);
            background: var(--selected-bg);
            box-shadow: 0 4px 18px var(--shadow);
        }
        .card-emoji { font-size: 1.7rem; flex-shrink: 0; line-height: 1.2; }
        .card-text h3 { font-size: 0.98rem; font-weight: 700; color: var(--navy); }
        .card-text p { font-size: 0.82rem; color: var(--text-light); margin-top: 0.15rem; line-height: 1.35; }

        /* ── FORM ── */
        .form-section {
            background: white;
            border-radius: 18px;
            padding: 2rem 2rem 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 2px 14px var(--shadow);
        }
        .field-group { margin-bottom: 1.6rem; }
        label {
            display: block; font-weight: 700;
            color: var(--navy); margin-bottom: 0.45rem; font-size: 1rem;
        }
        label .hint { font-weight: 400; color: var(--text-light); font-size: 0.88rem; }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            color: var(--text);
            background: var(--cream);
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--navy);
            background: white;
        }
        textarea { resize: vertical; min-height: 110px; }

        /* ── OUTPUT CARDS ── */
        .output-choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.1rem;
        }
        .output-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1.8rem 1.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .output-card:hover { border-color: var(--navy); box-shadow: 0 4px 18px var(--shadow); }
        .output-card.selected { border-color: var(--navy); background: var(--selected-bg); box-shadow: 0 4px 18px var(--shadow); }
        .output-icon { font-size: 2.2rem; margin-bottom: 0.7rem; }
        .output-card h3 { font-size: 1.05rem; font-weight: 700; color: var(--navy); }
        .output-card p { font-size: 0.88rem; color: var(--text-light); margin-top: 0.4rem; line-height: 1.4; }

        /* ── BUTTONS ── */
        .btn {
            padding: 0.9rem 2rem;
            border-radius: 11px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem; font-weight: 700;
            cursor: pointer; border: none;
            transition: all 0.2s ease;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn-primary { background: var(--navy); color: white; }
        .btn-primary:hover { background: var(--navy-dark); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(44,62,107,0.3); }
        .btn-primary:disabled { background: #bbb; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-back { background: transparent; color: var(--text-light); border: 2px solid var(--border); }
        .btn-back:hover { border-color: var(--navy); color: var(--navy); }
        .btn-copy { background: var(--sage); color: white; }
        .btn-copy:hover { background: var(--sage-dark); transform: translateY(-1px); }
        .btn-new { background: var(--terra); color: white; }
        .btn-new:hover { background: var(--terra-dark); transform: translateY(-1px); }
        .btn-row {
            display: flex; gap: 1rem;
            justify-content: space-between; align-items: center;
            margin-top: 2rem; flex-wrap: wrap;
        }

        /* ── RESULT ── */
        .result-box {
            background: white; border-radius: 18px;
            padding: 2rem; border: 1px solid var(--border);
            box-shadow: 0 2px 14px var(--shadow);
        }
        .result-instructions {
            background: var(--green-bg); border: 1px solid var(--green-border);
            border-radius: 11px; padding: 1rem 1.25rem;
            margin-bottom: 1rem; font-size: 0.95rem; color: var(--green-text);
            line-height: 1.55;
        }
        .result-instructions a { color: var(--green-text); font-weight: 700; }
        .result-content {
            background: var(--cream); border-radius: 10px;
            padding: 1.5rem 1.6rem; font-size: 1rem; line-height: 1.75;
            white-space: pre-wrap; color: var(--text);
            border: 1px solid var(--border); min-height: 180px;
        }

        /* ── LOADING ── */
        .loading { text-align: center; padding: 3.5rem; color: var(--text-light); }
        .spinner {
            width: 42px; height: 42px;
            border: 3px solid var(--border); border-top-color: var(--navy);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── FADE ── */
        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── FOOTER ── */
        footer {
            text-align: center; padding: 2rem;
            color: var(--text-light); font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 580px) {
            .letter-grid { grid-template-columns: 1fr; }
            .output-choices { grid-template-columns: 1fr; }
            header h1 { font-size: 1.9rem; }
            .form-section { padding: 1.5rem; }
            .step-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header>

</div>

<footer>Letter Helper &nbsp;·&nbsp; Built with care for everyday writers</footer>

        { id:'relationship',  label:'How did you know the person who passed?',              type:'text',     placeholder:'e.g., She was my neighbor for 20 years…' },
        { id:'memory',        label:'A special memory or quality to mention?', hint:'(optional)', type:'textarea', placeholder:'e.g., She always had the kindest smile…' },

    thankyou: [
        { id:'recipient', label:'Who are you thanking?',                    type:'text',     placeholder:'Their name or names' },
        { id:'reason',    label:'What are you thanking them for?',          type:'textarea', placeholder:'Describe what they did for you…' },
        { id:'impact',    label:'How did it help you or make you feel?',    type:'text',     placeholder:'e.g., It meant the world to me…' },
        { id:'name',      label:'Your name',                                type:'text',     placeholder:'How you\'d like to sign it' },
    ],
    official: [
        { id:'official',  label:'Who are you writing to?',             type:'text',     placeholder:'e.g., Senator Jane Smith, Mayor Johnson…' },
        { id:'issue',     label:'What issue are you writing about?',   type:'textarea', placeholder:'Describe the issue in your own words…' },
        { id:'want',      label:'What do you want them to do?',        type:'text',     placeholder:'e.g., Vote against this bill, fix the road on Main St…' },

        { id:'company', label:'Company or provider that sent the bill',   type:'text',     placeholder:'Company name' },

        { id:'issue',      label:'What is the situation?',                                   type:'textarea', placeholder:'Describe what happened or what you\'d like to discuss…' },

        { id:'name',       label:'Your full name',                                           type:'text',     placeholder:'Your name' },
    ],
    legacy: [
        { id:'recipient',  label:'Who is this letter for?',                                  type:'text',     placeholder:'e.g., My children, my grandchildren, my whole family…' },
        { id:'lesson',     label:'What is the most important life lesson you want to pass on?', type:'textarea', placeholder:'e.g., Always choose kindness, even when it\'s hard…' },
        { id:'values',     label:'What values or beliefs have guided your life?',             type:'textarea', placeholder:'e.g., Faith, hard work, staying close to family…' },
        { id:'memory',     label:'A favorite memory or story you\'d like to share?', hint:'(optional)', type:'textarea', placeholder:'Something you want them to always remember…' },
        { id:'heart',      label:'What do you most want them to know about who you are?', hint:'(optional)', type:'textarea', placeholder:'What\'s in your heart that\'s hard to say out loud…' },
        { id:'name',       label:'How would you like to sign this letter?',                  type:'text',     placeholder:'e.g., With all my love, Grandma Rose' },
    ],
    openwhen: [
        { id:'recipient',  label:'Who are you writing to?',                                  type:'text',     placeholder:'e.g., My daughter Emma, my son Marcus…' },
        { id:'occasion',   label:'What is the "Open when…" moment?',                        type:'text',     placeholder:'e.g., Open when you\'re feeling down, Open when you miss home…' },

        { id:'name',       label:'Your name',                                                type:'text',     placeholder:'How you\'d like to sign it' },
    ],

const tones = {
    insurance: 'firm and assertive but professional — the tone of someone who knows their rights',
    medical:   'respectful and clear, focused on getting the necessary care',
    complaint: 'polite but firm, focused on a specific resolution',
    landlord:  'professional and clear, with awareness of tenant rights',
    sympathy:  'warm, heartfelt, and genuinely comforting',
    thankyou:  'warm, specific, and sincere',
    official:  'respectful and civic-minded, clearly stating a request',
    bill:      'firm and factual, requesting a specific correction',
    refund:    'polite but firm, clearly stating the expectation',
    school:    'collaborative and concerned, professional in tone',
    legacy:    'deeply personal, warm, and heartfelt — this is a gift of love meant to last generations',
    openwhen:  'warm, intimate, and specific to the moment — like a hug in letter form',
    brighten:  'cheerful, genuine, and uplifting — the tone of a kind stranger sharing warmth and light',
};

const progressByStep = { 1: 10, 2: 45, 3: 72, 4: 100 };

// ─────────────────────────────────────────
//  RENDER ENGINE
// ─────────────────────────────────────────
function render(scrollToTop = false) {
    document.getElementById('progressFill').style.width = progressByStep[state.step] + '%';
    const app = document.getElementById('app');
    app.innerHTML = '';
    void app.offsetWidth; // reflow for animation
    app.classList.add('fade-in');
    // Only scroll to top on step changes, not card selection
    if (scrollToTop) requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));

    if      (state.step === 1) renderStep1(app);
    else if (state.step === 2) renderStep2(app);
    else if (state.step === 3) renderStep3(app);
    else if (state.step === 4) renderStep4Loading(app);
}

function dots(current) {
    return `<div class="steps-indicator">
        ${[1,2,3,4].map(n =>
            `<div class="step-dot ${n < current ? 'done' : n === current ? 'active' : ''}"></div>`
        ).join('')}
    </div>`;
}

// ── STEP 1 ──
function renderStep1(el) {
    el.innerHTML = `
        ${dots(1)}
        <div class="step-header">
            <div class="step-label">Step 1 of 3</div>
            <div class="step-title">What kind of letter do you need?</div>
            <div class="step-subtitle">Pick the one that best fits your situation</div>
        </div>
        <div class="letter-grid">
            ${letterTypes.map(lt => `
                <div class="letter-card ${state.letterType === lt.id ? 'selected' : ''}"
                     onclick="selectType('${lt.id}')">
                    <div class="card-emoji">${lt.emoji}</div>
                    <div class="card-text">
                        <h3>${lt.title}</h3>
                        <p>${lt.desc}</p>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="btn-row" style="justify-content:flex-end;">
            <button class="btn btn-primary" onclick="toStep2()" ${!state.letterType ? 'disabled' : ''}>
                Next Step →
            </button>
        </div>`;
}

// ── STEP 2 ──
function renderStep2(el) {
    const q  = questionSets[state.letterType];
    const lt = letterTypes.find(x => x.id === state.letterType);
    el.innerHTML = `
        ${dots(2)}
        <div class="step-header">
            <div class="step-label">Step 2 of 3</div>
            <div class="step-title">${lt.emoji} ${lt.title}</div>
            <div class="step-subtitle">Just write naturally — like you're explaining it to a friend</div>
        </div>
        <div class="form-section">
            ${q.map(field => `
                <div class="field-group">
                    <label for="${field.id}">
                        ${field.label}
                        ${field.hint ? `<span class="hint"> ${field.hint}</span>` : ''}
                    </label>
                    ${field.type === 'textarea'
                        ? `<textarea id="${field.id}" placeholder="${field.placeholder}"
                               oninput="save('${field.id}',this.value)">${state.fields[field.id] || ''}</textarea>`
                        : `<input type="text" id="${field.id}" placeholder="${field.placeholder}"
                               value="${state.fields[field.id] || ''}"
                               oninput="save('${field.id}',this.value)">`
                    }
                </div>`).join('')}
        </div>
        <div class="btn-row">
            <button class="btn btn-back" onclick="back()">← Back</button>
            <button class="btn btn-primary" onclick="toStep3()">Next Step →</button>
        </div>`;
}

// ── STEP 3 ──
function renderStep3(el) {
    el.innerHTML = `
        ${dots(3)}
        <div class="step-header">
            <div class="step-label">Step 3 of 3</div>
            <div class="step-title">How would you like your letter?</div>
            <div class="step-subtitle">Choose whichever works best for you</div>
        </div>
        <div class="output-choices">
            <div class="output-card ${state.outputMode === 'prompt' ? 'selected' : ''}"
                 onclick="selectMode('prompt')">
                <div class="output-icon">📋</div>
                <h3>Give Me a Prompt</h3>
                <p>Get a ready-made prompt to paste into ChatGPT or Claude yourself</p>
            </div>
            <div class="output-card ${state.outputMode === 'letter' ? 'selected' : ''}"
                 onclick="selectMode('letter')">
                <div class="output-icon">✉️</div>
                <h3>Write My Letter Now</h3>
                <p>Get your complete, ready-to-send letter written right here</p>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-back" onclick="back()">← Back</button>
            <button class="btn btn-primary" onclick="generate()"
                    ${!state.outputMode ? 'disabled' : ''}>
                ✨ Create My Letter
            </button>
        </div>`;
}

// ── STEP 4 — LOADING ──
function renderStep4Loading(el) {
    el.innerHTML = `
        ${dots(4)}
        <div class="result-box">
            <div class="loading">
                <div class="spinner"></div>
                <p>Writing your letter… just a moment ☕</p>
            </div>
        </div>`;
}

// ── STEP 4 — RESULT ──
function renderStep4Result(el, content, isPrompt) {
    const lt = letterTypes.find(x => x.id === state.letterType);
    el.innerHTML = `
        ${dots(4)}
        <div class="step-header">
            <div class="step-label">${isPrompt ? '📋 Your Prompt is Ready' : '✉️ Your Letter is Ready'}</div>
            <div class="step-title">${lt.emoji} ${lt.title}</div>
        </div>
        <div class="result-box fade-in">
            ${isPrompt ? `
            <div class="result-instructions">
                <strong>How to use your prompt:</strong><br>
                1. Click <strong>Copy Prompt</strong> below<br>
                2. Open <a href="https://chat.openai.com" target="_blank">ChatGPT</a> or <a href="https://claude.ai" target="_blank">Claude.ai</a> in a new tab<br>
                3. Paste the prompt and press Enter<br>
                4. Copy the finished letter it writes for you!
            </div>` : `
            <div class="result-instructions">
                <strong>Your letter is ready!</strong> Review it below, make any small edits you'd like, then copy and send.
            </div>`}
            <div class="result-content" id="resultContent">${content}</div>
            <div class="btn-row">
                <button class="btn btn-new" onclick="restart()">← Write Another Letter</button>
                <div style="display:flex;gap:0.7rem;flex-wrap:wrap;justify-content:flex-end;">
                    ${!isPrompt ? `<button class="btn btn-back" onclick="regenerate()" style="border-color:var(--navy);color:var(--navy);">🔄 Regenerate</button>` : ''}
                    <button class="btn btn-copy" id="copyBtn" onclick="copyResult()">
                        📋 Copy ${isPrompt ? 'Prompt' : 'Letter'}
                    </button>
                </div>
            </div>
        </div>`;
}

// ─────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────
function selectType(id) {
    if (state.letterType !== id) state.fields = {};
    state.letterType = id;
    render(false); // don't scroll to top when selecting a card
}

function save(id, val) { state.fields[id] = val; }

function selectMode(m) { state.outputMode = m; render(); }

function toStep2() { if (state.letterType) { state.step = 2; render(true); } }

function toStep3() { state.step = 3; render(true); }

function back() { state.step--; render(true); }

function restart() {
    Object.assign(state, { step:1, letterType:null, fields:{}, outputMode:null });
    render(true);
}

async function regenerate() {
    // Keep all state but re-run generation
    state.step = 4;
    render(); // show loading
    try {
        const letter = await callAPI();
        renderStep4Result(document.getElementById('app'), letter, false);
    } catch(e) {
        renderStep4Result(document.getElementById('app'),
            'Sorry, there was a problem generating your letter.

Tip: Try the "Give Me a Prompt" option — it works without an internet connection to our AI service, and you can paste the prompt into ChatGPT or Claude directly.',
            false);
    }
}

async function generate() {
    state.step = 4;
    render(true); // show loading, scroll to top

    if (state.outputMode === 'prompt') {
        const prompt = buildPrompt();
        renderStep4Result(document.getElementById('app'), prompt, true);
    } else {
        try {
            const letter = await callAPI();
            renderStep4Result(document.getElementById('app'), letter, false);
        } catch(e) {
            renderStep4Result(document.getElementById('app'),
                'Sorry, there was a problem generating your letter.\n\nTip: Try the "Give Me a Prompt" option — it works without an internet connection to our AI service, and you can paste the prompt into ChatGPT or Claude directly.',
                false);
        }
    }
}

// ─────────────────────────────────────────
//  PROMPT BUILDER (no API needed)
// ─────────────────────────────────────────
function buildPrompt() {
    const lt = letterTypes.find(x => x.id === state.letterType);
    const qs = questionSets[state.letterType];
    let details = '';
    qs.forEach(q => {
        const v = state.fields[q.id];
        if (v && v.trim()) details += `• ${q.label}: ${v}\n`;
    });

    return `Please write a professional and polite ${lt.title.toLowerCase()} letter for me.

Here are my details:
${details}
Instructions for the letter:
- Use clear, plain language — no legal jargon
- Be ${tones[state.letterType]}
- Format properly: today's date at the top, a greeting, 2–3 focused paragraphs, and a professional closing with my name
- Make it ready to print or send as-is

Please write the complete letter.`;
}

// ─────────────────────────────────────────
//  API CALL (generates the actual letter)
// ─────────────────────────────────────────
async function callAPI() {
    const lt = letterTypes.find(x => x.id === state.letterType);
    const qs = questionSets[state.letterType];
    let details = '';
    qs.forEach(q => {
        const v = state.fields[q.id];
        if (v && v.trim()) details += `• ${q.label}: ${v}\n`;
    });

    const today = new Date().toLocaleDateString('en-US', {
        year:'numeric', month:'long', day:'numeric'
    });

    const systemPrompt = `You are a warm, skilled letter writer who helps everyday people communicate clearly and effectively. Write complete, properly formatted letters. Use today's date: ${today}. Use plain, clear language — never legal jargon. The tone should be: ${tones[lt.id]}. Format: date at top, recipient greeting, well-organized paragraphs (2–4), professional closing with writer's name. Make it feel genuine and human, not robotic.`;

    const userMessage = `Please write a ${lt.title.toLowerCase()} letter with these details:\n\n${details}\n\nWrite the complete, formatted letter — ready to copy and send.`;

    const res = await fetch("/.netlify/functions/generate-letter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ systemPrompt, userMessage })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.content[0].text;
}

// ─────────────────────────────────────────
//  COPY UTILITY
// ─────────────────────────────────────────
function copyResult() {
    const content = document.getElementById('resultContent').innerText;
    navigator.clipboard.writeText(content).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = original, 2200);
    });
}

// ── INIT ──
render();
</script>
</body>
</html>
